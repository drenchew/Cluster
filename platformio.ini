; PlatformIO Project Configuration File
; BMW E9x instrument cluster bench driver - Arduino Uno + MCP2515 (HW-184, 8 MHz)
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; --- libraries (auto-installed on first build) ---
lib_deps =
    autowp/autowp-mcp2515@^1.2.1

; --- build ---
build_flags =
    -D SERIAL_BAUD=115200

; --- serial / upload ---
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
; Uncomment and set if PlatformIO picks the wrong port:
; upload_port = COM6
; monitor_port = COM6
